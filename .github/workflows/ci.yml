name: reproducibility-smoke-check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and model checks
        run: python scripts/self_check.py
      - name: Released-data integrity
        run: python scripts/validate_submission.py

[project]
name = "wsn-lifetime-access"
version = "0.1.0"
description = "Dynamic residual-energy-aware dominating-set scheduling benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]
authors = [
  {name = "Lijo M. Jose"},
  {name = "Deepu Benson"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
